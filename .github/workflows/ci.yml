name: CI & Required Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Build Frontend & Verify Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout Design System Peer Repo
        uses: actions/checkout@v4
        with:
          repository: rtkelly13/design-system
          path: design-system

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build Design System Peer Repo
        run: |
          cd design-system
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Install Frontend Dependencies & Link Design System
        run: |
          cd app/frontend
          pnpm link ../../design-system
          pnpm install --no-frozen-lockfile

      - name: Build Frontend Bundle
        run: |
          cd app/frontend
          pnpm build

      - name: Install Backend Dependencies
        run: |
          cd app/backend
          uv sync
